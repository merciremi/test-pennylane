# fly.toml app configuration file generated for test-pennylane on 2023-09-25T11:37:49+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "test-pennylane"
primary_region = "cdg"
console_command = "/rails/bin/rails console"

[build]

[[statics]]
  guest_path = "/rails/public"
  url_prefix = "/"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
  [http_service.concurrency]
    type = "requests"
    soft_limit = 500
    hard_limit = 550
